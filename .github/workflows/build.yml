name: Build and Release (CORS-patched)

# Auto-build a patched ollama binary whenever upstream ollama/ollama ships a
# new release tag. The patch defaults OLLAMA_ORIGINS to "*" so browser
# extensions / non-localhost origins aren't CORS-rejected out of the box.
#
# Triggered by:
#   - schedule: poll upstream tags once a day
#   - workflow_dispatch: manual run from the Actions tab

on:
  schedule:
    - cron: '17 4 * * *'  # daily, off-peak UTC
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (e.g. v0.32.4). Leave blank for latest stable.'
        required: false
        default: ''

permissions:
  contents: write  # needed to create releases

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve upstream tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - name: Determine upstream tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git ls-remote --tags --sort=-version:refname \
                    https://github.com/ollama/ollama.git \
                  | awk '{print $2}' \
                  | sed 's#refs/tags/##' \
                  | grep -v '\^' \
                  | grep -v -- '-rc' \
                  | head -1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not determine upstream tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream tag: $TAG"

      - name: Skip if release already published
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "Release ${{ steps.tag.outputs.tag }} already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.label }}
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-latest
            shell: bash
            artifact: ollama-darwin-arm64
            prepare: |
              brew install go zstd npm
            build: |
              chmod +x ./scripts/build_darwin.sh
              ./scripts/build_darwin.sh build package app
            package_step: |
              # _build_macapp produces dist/Ollama-darwin.zip — the .app bundle.
              # It contains the same patched ollama binary plus MLX/Metal libs,
              # matches the layout ollama's official release ships.
              if [ -f dist/Ollama-darwin.zip ]; then
                mv dist/Ollama-darwin.zip ollama-darwin-arm64.zip
              else
                echo "::error::dist/Ollama-darwin.zip not found — build_darwin.sh app step did not produce it"
                exit 1
              fi
          - label: Linux (amd64)
            runner: ubuntu-latest
            shell: bash
            artifact: ollama-linux-amd64
            prepare: |
              sudo apt-get update
              sudo apt-get install -y zstd
            build: |
              chmod +x ./scripts/build_linux.sh
              PLATFORM=linux/amd64 ./scripts/build_linux.sh
            package_step: |
              cp dist/ollama-linux-amd64.tar.zst ../ollama-linux-amd64.tar.zst
          - label: Windows (amd64)
            runner: windows-latest
            shell: pwsh
            artifact: ollama-windows-amd64
            prepare: |
              choco install -y 7zip golang
            build: |
              powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1
            package_step: |
              if (Test-Path dist\ollama-windows-amd64.zip) {
                Copy-Item dist\ollama-windows-amd64.zip ..\ollama-windows-amd64.zip -Force
              } else {
                throw "Windows build did not produce dist\ollama-windows-amd64.zip"
              }

    steps:
      - name: Checkout this repo (for patch file)
        uses: actions/checkout@v4

      - name: Clone upstream ollama at ${{ needs.setup.outputs.tag }}
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ needs.setup.outputs.tag }}" \
            https://github.com/ollama/ollama.git src
          cd src
          echo "Checked out $(git rev-parse HEAD)"

      - name: Apply OLLAMA_ORIGINS patch
        shell: bash
        working-directory: src
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/owenzhao/ollama/main/patches/ollama_origins.patch \
            -o ollama_origins.patch
          git apply --check ollama_origins.patch || {
            echo "::error::Patch no longer applies cleanly. Update patches/ollama_origins.patch."
            exit 1
          }
          git apply ollama_origins.patch
          rm ollama_origins.patch
          echo "Patch applied. Verifying:"
          grep -A3 "func AllowedOrigins" envconfig/config.go | head -10

      - name: Install prerequisites
        run: ${{ matrix.prepare }}

      - name: Build
        working-directory: src
        run: ${{ matrix.build }}

      - name: Package artifact
        working-directory: src
        run: ${{ matrix.package_step }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [setup, build]
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we got
        run: ls -lah artifacts/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping create."
            exit 0
          fi
          gh release create "$TAG" \
            artifacts/* \
            --title "Ollama $TAG (CORS-patched)" \
            --notes "Auto-built from [ollama/ollama $TAG](https://github.com/ollama/ollama/releases/tag/$TAG) with the OLLAMA_ORIGINS default flipped to \`*\` so browser extensions and non-localhost origins work without setting the env var.

          **Patch:** see \`patches/ollama_origins.patch\` in this repo.

          **Artifacts:**
          - \`ollama-darwin-arm64.zip\` — macOS Apple Silicon
          - \`ollama-linux-amd64.tar.zst\` — Linux x86_64
          - \`ollama-windows-amd64.zip\` — Windows x86_64"
