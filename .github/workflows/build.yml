name: Build and Release (CORS-patched)

# Build a patched ollama binary on demand. The patch defaults OLLAMA_ORIGINS
# to "*" so browser extensions / non-localhost origins aren't CORS-rejected
# out of the box.
#
# Triggered by:
#   - workflow_dispatch: manual run from the Actions tab
#
# The automatic daily build has been retired: the official Ollama binaries plus
# the OLLAMA_ORIGINS environment variable produce the same allowlist, and the
# official Windows/macOS artifacts keep full GPU acceleration. See the README.

on:
  # The automatic daily build is retired. The official Ollama binaries plus the
  # OLLAMA_ORIGINS environment variable produce the exact same CORS behaviour
  # (see the README), and the official Windows/macOS artifacts additionally ship
  # full GPU acceleration (CUDA / ROCm / Vulkan, MLX) that a self-built binary
  # is easy to lose. Trigger this workflow manually from the Actions tab when
  # you want a pre-patched build to hand out.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (e.g. v0.32.4). Leave blank for latest stable.'
        required: false
        default: ''

permissions:
  contents: write  # needed to create releases

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve upstream tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - name: Determine upstream tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git ls-remote --tags --sort=-version:refname \
                    https://github.com/ollama/ollama.git \
                  | awk '{print $2}' \
                  | sed 's#refs/tags/##' \
                  | grep -v '\^' \
                  | grep -v -- '-rc' \
                  | head -1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not determine upstream tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream tag: $TAG"

      - name: Skip if release already published
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "Release ${{ steps.tag.outputs.tag }} already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.label }}
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-latest
            shell: bash
            artifact: ollama-darwin-arm64
            prepare: |
              brew install go zstd npm
            build: |
              chmod +x ./scripts/build_darwin.sh
              ./scripts/build_darwin.sh build package app
            package_step: |
              # _build_macapp produces dist/Ollama-darwin.zip — the .app bundle.
              # It contains the same patched ollama binary plus MLX/Metal libs,
              # matches the layout ollama's official release ships.
              #
              # Move it to the workspace root so the next step's upload-artifact
              # (which runs from $GITHUB_WORKSPACE) can find it.
              if [ -f dist/Ollama-darwin.zip ]; then
                mv dist/Ollama-darwin.zip "${GITHUB_WORKSPACE}/ollama-darwin-arm64.zip"
              else
                echo "::error::dist/Ollama-darwin.zip not found — build_darwin.sh app step did not produce it"
                exit 1
              fi
          # Linux build temporarily disabled: docker buildx + 600+ .cpp files
          # hangs / takes 3+ hours on GitHub's ubuntu-latest runner. macOS
          # (this fork's primary target) and Windows already work. Re-enable
          # when there's bandwidth to optimize (e.g. ccache, multi-stage cache,
          # or move Linux build to a self-hosted runner).
          # - label: Linux (amd64)
          #   runner: ubuntu-latest
          #   shell: bash
          #   artifact: ollama-linux-amd64
          #   prepare: |
          #     sudo apt-get update
          #     sudo apt-get install -y zstd
          #   build: |
          #     chmod +x ./scripts/build_linux.sh
          #     PLATFORM=linux/amd64 ./scripts/build_linux.sh
          #   package_step: |
          #     cp dist/ollama-linux-amd64.tar.zst ../ollama-linux-amd64.tar.zst
          - label: Windows (amd64)
            runner: windows-latest
            shell: pwsh
            artifact: ollama-windows-amd64
            prepare: |
              choco install -y 7zip golang
            build: |
              powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1
            package_step: |
              if (Test-Path dist\ollama-windows-amd64.zip) {
                Copy-Item dist\ollama-windows-amd64.zip ..\ollama-windows-amd64.zip -Force
              } else {
                throw "Windows build did not produce dist\ollama-windows-amd64.zip"
              }
          # GPU-enabled Windows build, shipped as a SEPARATE artifact.
          #
          # Why a separate matrix leg instead of extending the one above:
          #   a failing matrix leg fails the whole `build` job, which would
          #   block the `release` job and therefore the macOS artifact too.
          #   `continue-on-error: true` makes this leg's failure non-fatal, so
          #   a broken GPU build can never take the macOS release down with it.
          #
          # Why Vulkan first: the Vulkan backend needs no GPU at build time
          # and no multi-GB CUDA Toolkit, so it compiles in minutes on a
          # stock GitHub-hosted windows-latest runner (~40 MB of artifacts).
          # CUDA needs the toolkit plus a 12-architecture nvcc compile, which
          # is a coin flip on 4 vCPU / 16 GB runners — see the notes in the
          # PR for adding it safely.
          - label: Windows (amd64, GPU)
            runner: windows-latest
            shell: pwsh
            artifact: ollama-windows-amd64-gpu
            continue-on-error: true
            prepare: |
              choco install -y 7zip golang
              # scripts/build_windows.ps1 only builds the Vulkan backend when
              # $env:VULKAN_SDK is set; otherwise it prints "Vulkan not
              # detected, skipping" and ships a CPU-only binary. Same
              # installer URL and flags that ollama/ollama uses upstream.
              $vulkanInstaller = "$env:RUNNER_TEMP\vulkansdk-windows-X64-1.4.321.1.exe"
              Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/1.4.321.1/windows/vulkansdk-windows-X64-1.4.321.1.exe' -OutFile $vulkanInstaller
              Write-Output "Installing Vulkan SDK 1.4.321.1..."
              Start-Process -FilePath $vulkanInstaller -ArgumentList '-c','--am','--al','in' -NoNewWindow -Wait
              $vulkanRoot = @(Resolve-Path 'C:\VulkanSDK\*')[0].Path
              $vulkanRuntime = Join-Path $vulkanRoot 'Helpers\VulkanRT.exe'
              if (Test-Path $vulkanRuntime) {
                Start-Process -FilePath $vulkanRuntime -ArgumentList '/s' -NoNewWindow -Wait
              }
              echo "$vulkanRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              echo "VULKAN_SDK=$vulkanRoot" >> $env:GITHUB_ENV
              Write-Output "Vulkan SDK ready: $vulkanRoot"
            build: |
              powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1
            package_step: |
              if (Test-Path dist\ollama-windows-amd64.zip) {
                Copy-Item dist\ollama-windows-amd64.zip ..\ollama-windows-amd64-gpu.zip -Force
              } else {
                throw "Windows GPU build did not produce dist\ollama-windows-amd64.zip"
              }
              if (-not (Test-Path dist\windows-amd64\lib\ollama\vulkan\ggml-vulkan.dll)) {
                throw "Vulkan backend missing — the build silently fell back to CPU-only"
              }

    steps:
      - name: Checkout this repo (for patch file)
        uses: actions/checkout@v4

      - name: Clone upstream ollama at ${{ needs.setup.outputs.tag }}
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ needs.setup.outputs.tag }}" \
            https://github.com/ollama/ollama.git src
          cd src
          echo "Checked out $(git rev-parse HEAD)"

      - name: Apply OLLAMA_ORIGINS patch
        shell: bash
        working-directory: src
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/owenzhao/ollama/main/patches/ollama_origins.patch \
            -o ollama_origins.patch
          git apply --check ollama_origins.patch || {
            echo "::error::Patch no longer applies cleanly. Update patches/ollama_origins.patch."
            exit 1
          }
          git apply ollama_origins.patch
          rm ollama_origins.patch
          echo "Patch applied. Verifying:"
          grep -A3 "func AllowedOrigins" envconfig/config.go | head -10

      - name: Install prerequisites
        run: ${{ matrix.prepare }}

      - name: Build
        working-directory: src
        run: ${{ matrix.build }}

      - name: Package artifact
        working-directory: src
        run: ${{ matrix.package_step }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [setup, build]
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        # gh release create needs git metadata to find the owner/repo of
        # the release target. download-artifact alone leaves the workspace
        # without a .git, so this step has to come first.
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we got
        run: ls -lah artifacts/

      - name: Build matching source archive
        # Ship the exact upstream-tag source + our patch as a tarball, so
        # anyone who wants to reproduce the binary build from source has the
        # right tree (the "Source code" zip GitHub attaches automatically
        # reflects the fork's main HEAD, not the build-time upstream tag).
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" https://github.com/ollama/ollama.git src
          cd src
          curl -fsSL \
            https://raw.githubusercontent.com/owenzhao/ollama/main/patches/ollama_origins.patch \
            -o ollama_origins.patch
          git apply --check ollama_origins.patch
          git apply ollama_origins.patch
          # Strip the .git directory and produce a clean tarball.
          rm -rf .git
          tar --owner 0 --group 0 -czf "../ollama-${TAG}-patched-source.tar.gz" .
          cd ..
          ls -lh "ollama-${TAG}-patched-source.tar.gz"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping create."
            exit 0
          fi
          gh release create "$TAG" \
            artifacts/* \
            "ollama-${TAG}-patched-source.tar.gz" \
            --title "Ollama $TAG (CORS-patched)" \
            --notes "Auto-built from [ollama/ollama $TAG](https://github.com/ollama/ollama/releases/tag/$TAG) with the OLLAMA_ORIGINS default flipped to \`*\` so browser extensions and non-localhost origins work without setting the env var.

          **Patch:** see \`patches/ollama_origins.patch\` in this repo.

          **Artifacts:**
          - \`ollama-darwin-arm64.zip\` — macOS Apple Silicon
          - \`ollama-windows-amd64.zip\` — Windows x86_64
          - \`ollama-${TAG}-patched-source.tar.gz\` — exact upstream \`$TAG\` source tree with the patch already applied (use this if you want to reproduce the build from source)
          (Linux build is disabled in this fork — see README for the self-build path.)"
